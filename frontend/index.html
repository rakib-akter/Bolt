<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tradebot Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Paper trading monitor</p>
          <h1>Tradebot Dashboard</h1>
        </div>
        <button id="refreshButton" type="button">Refresh</button>
      </header>

      <section class="metrics" aria-label="Bot metrics">
        <article>
          <span>Environment</span>
          <strong id="environment">-</strong>
        </article>
        <article>
          <span>Broker</span>
          <strong id="broker">-</strong>
        </article>
        <article>
          <span>Cash</span>
          <strong id="cash">-</strong>
        </article>
        <article>
          <span>Positions</span>
          <strong id="positions">-</strong>
        </article>
      </section>

      <section class="grid">
        <form id="candleForm" class="panel">
          <h2>Add Candle</h2>
          <label>
            Symbol
            <input name="symbol" value="AAPL" required />
          </label>
          <label>
            Close
            <input name="close" type="number" step="0.01" value="101" required />
          </label>
          <button type="submit">Store Candle</button>
        </form>

        <form id="runForm" class="panel">
          <h2>Run Strategy</h2>
          <label>
            Symbol
            <input name="symbol" value="AAPL" required />
          </label>
          <label>
            Stop Loss
            <input name="stopLoss" type="number" step="0.01" value="95" required />
          </label>
          <button type="submit">Run Once</button>
        </form>
      </section>

      <section class="panel">
        <h2>Latest Activity</h2>
        <pre id="activity">Waiting for backend...</pre>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
